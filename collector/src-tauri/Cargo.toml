[package]
name = "tangbang-collector"
version = "0.1.0"
edition = "2021"
publish = false
description = "탕방 데이터 수집 도구 (데스크톱 앱: 준비 점검 → ego 수집 → 판정·합치기·화면 데이터)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] } # Claude 사용량 기록 시각(KST)
csv = "1.3"
percent-encoding = "2"

[profile.release]
opt-level = 3
strip = true
