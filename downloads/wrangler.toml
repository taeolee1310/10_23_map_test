# 탕방 도구함(다운로드 사이트): 수집 프로그램·제보함 설치 파일과 업데이트를 비밀번호 뒤에서 나눠 준다.
# 화면·서버가 한 Worker에 있다(src/index.js). 설치 파일은 R2 tangbang-downloads, 로그인 실패 횟수·받은 기록은 D1 tangbang(dl_* 표).
# 비밀 값(값은 아무 데도 적지 않는다): DOWNLOAD_CODE(측근에게 알려 줄 숫자 비밀번호, 주인이 직접 넣는다),
#   COOKIE_KEY(로그인 쿠키 서명), UPDATE_KEY(앱이 업데이트를 확인할 때 보내는 열쇠), RELEASE_TOKEN(GitHub Actions가 설치 파일을 올릴 때 쓰는 열쇠)
name = "tangbang-downloads"
main = "src/index.js"
compatibility_date = "2026-10-01"

# 화면 파일(HTML·CSS·SVG)을 글자로 묶어 넣는다. 색·움직임 토큰은 서비스와 같은 파일을 그대로 쓴다
[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.css", "**/*.svg"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "tangbang"
database_id = "3fe9aac3-c97c-4d2b-ac5d-0b343274ce57"

[[r2_buckets]]
binding = "FILES"
bucket_name = "tangbang-downloads"
