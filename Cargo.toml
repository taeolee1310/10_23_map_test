[package]
name = "tangbang-data"
version = "0.1.0"
edition = "2021"
publish = false
description = "탕방 데이터 정리·수집 도구 (예전 파이썬 스크립트를 러스트로 옮김)"

# 실행: cargo run --release --bin <이름>   (이름은 src/bin/ 파일 이름)
[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
csv = "1.3"
dotenvy = "0.15"
encoding_rs = "0.8"
percent-encoding = "2"
regex = "1"
# native-tls = 윈도우 기본 TLS(schannel). C 컴파일러 없이 빌드된다
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[profile.release]
opt-level = 3
