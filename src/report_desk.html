<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>탕방 제보함</title>
<link rel="icon" type="image/png" href="/icon.png">
<link rel="stylesheet" href="/colors.css">
<link rel="stylesheet" href="/motion.css">
<style>
  /* 색은 tangbang-colors.css의 semantic·component 토큰만 쓴다 */
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--color-bg-page); color: var(--color-text-primary); font: 15px/1.55 "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 24px 24px 120px; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 18px; margin: 0; }
  .sub { color: var(--color-text-secondary); font-size: 13px; margin: 2px 0 0; }
  .demo { background: var(--color-state-warning-bg); color: var(--color-state-warning-text); border-radius: var(--radius-sm); padding: 4px 12px; font-size: 13px; }
  .cols { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; align-items: start; }
  .card { background: var(--color-bg-surface); border: 1px solid var(--color-border-default); border-radius: var(--radius-md); }
  .list { overflow: clip; }
  .list h3, .step { font-size: 12px; font-weight: 600; color: var(--color-text-muted); margin: 0; }
  .list-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 8px 6px 14px; border-bottom: 1px solid var(--color-border-subtle); }
  .list-head h3 { min-width: 0; }
  .list-head .btn { flex: none; }
  .sweep { padding: 10px 14px; border-bottom: 1px solid var(--color-border-subtle); }
  .sweep .btn { width: 100%; justify-content: center; }
  .item { display: block; width: 100%; min-height: 44px; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--color-border-subtle); border-left: 4px solid transparent; padding: 12px 14px 12px 10px; cursor: pointer; }
  .item:hover { background: var(--color-action-outline-hover); }
  .item[aria-current="true"] { background: var(--color-bg-surface-muted); border-left-color: var(--color-border-focus); }
  .item b { display: block; font-weight: 600; overflow-wrap: anywhere; }
  .item span.s { display: block; color: var(--color-text-secondary); font-size: 13px; margin-bottom: 4px; overflow-wrap: anywhere; }
  .chip { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: var(--radius-sm); background: var(--badge-neutral-bg); color: var(--badge-neutral-text); }
  .chip.new { background: var(--badge-facility-bg); color: var(--badge-facility-text); }
  .chip.warn { background: var(--color-state-warning-bg); color: var(--color-state-warning-text); }
  .chip.bad { background: var(--color-state-error-bg); color: var(--color-text-primary); }
  .chip.ok { background: var(--color-state-success-bg); color: var(--color-text-primary); }
  .detail { padding: 20px 22px; min-width: 0; }
  .head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: flex-start; justify-content: space-between; }
  .head .links { display: flex; flex-wrap: wrap; gap: 8px; }
  .addr { color: var(--color-text-secondary); font-size: 13px; margin: 2px 0 0; overflow-wrap: anywhere; }
  .step { margin: 18px 0 8px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .rows { display: grid; gap: 10px; }
  .field { border: 1px solid var(--color-border-subtle); border-radius: var(--radius-sm); padding: 12px; min-width: 0; }
  .field[data-mode="ok"], .field[data-mode="diff"] { border-color: var(--color-border-focus); }
  .field .top { display: grid; grid-template-columns: 96px minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
  .k { color: var(--color-text-secondary); font-size: 13px; padding-top: 2px; }
  .v { font-weight: 600; overflow-wrap: anywhere; }
  .v small, .v .tag { display: block; color: var(--color-text-secondary); font-weight: 400; font-size: 12px; overflow-wrap: anywhere; }
  .v .tag.sus { color: var(--color-state-warning-text); }
  .v.none { color: var(--color-text-muted); font-weight: 400; }
  .col-h { display: grid; grid-template-columns: 96px minmax(0, 1fr) minmax(0, 1fr); gap: 12px; padding: 0 13px 4px; font-size: 12px; color: var(--color-text-muted); }
  .proof { margin: 10px 0 0; padding: 8px 10px; background: var(--color-bg-surface-muted); border-radius: var(--radius-sm); font-size: 13px; color: var(--color-text-secondary); }
  .proof b { font-weight: 600; color: var(--color-text-primary); font-size: 12px; }
  .proof div { overflow-wrap: anywhere; margin-top: 2px; }
  .picks { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; }
  .pick { min-height: 40px; padding: 0 12px; border-radius: var(--radius-pill); border: 1px solid var(--chip-border); background: var(--chip-bg); color: var(--chip-text); cursor: pointer; }
  .pick:hover { background: var(--chip-bg-hover); }
  .pick[aria-pressed="true"] { background: var(--chip-bg-selected); color: var(--chip-text-selected); border-color: var(--chip-border-selected); }
  .diff { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
  .diff label { font-size: 13px; color: var(--color-text-secondary); display: inline-flex; gap: 6px; align-items: center; }
  .reports { margin: 10px 0 0; padding: 0; list-style: none; font-size: 13px; color: var(--color-text-secondary); }
  .reports li { padding: 2px 0; overflow-wrap: anywhere; }
  /* 덧붙일 말: 제보한 사람이 직접 적은 설명. 판정에 가장 큰 단서라 값 비교 위에 본문 크기로 따로 둔다(예전에는 아래 회색 줄 끝에 붙어 있어 안 보였다) */
  .memos { display: grid; gap: 8px; margin: 0 0 14px; }
  .memo { margin: 0; padding: 10px 12px; border-left: 3px solid var(--color-border-focus); border-radius: var(--radius-sm); background: var(--color-bg-surface-muted); }
  .memo b { display: block; margin-bottom: 2px; font-size: 12px; font-weight: 600; color: var(--color-text-secondary); }
  .memo span { display: block; font-size: 15px; line-height: 1.6; color: var(--color-text-primary); white-space: pre-wrap; overflow-wrap: anywhere; }
  .chip.note { margin-left: 6px; background: var(--color-bg-surface-muted); color: var(--color-text-primary); }
  /* 가기 전 알아둘 것: 종류는 작은 표시, 글은 본문 크기. 글마다 따로 맞음·버림을 고른다 */
  .tipbox + .tipbox { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--color-border-subtle); }
  .tip { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; font-size: 15px; font-weight: 400; line-height: 1.6; }
  .tip .chip { flex: none; }
  .tip .t { min-width: 0; overflow-wrap: anywhere; }
  .tipedit { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; font-weight: 400; }
  .tipedit input[type="text"], .diff input[type="text"] { flex: 1 1 200px; }
  /* 새로 고침 자리: 버튼과 바나나우유 로더를 같은 칸에 겹쳐 둔다(자리 크기가 바뀌지 않게). 불러오는 동안만 로더가 보인다 */
  .refresh-slot { flex: none; display: inline-grid; align-items: center; justify-items: center; }
  .refresh-slot > * { grid-area: 1 / 1; }
  .refresh-slot[data-loading] .btn { opacity: 0; pointer-events: none; }
  .milk { display: inline-flex; align-items: center; gap: 6px; opacity: 0; pointer-events: none; font-size: 13px; color: var(--color-text-secondary); }
  .refresh-slot[data-loading] .milk { opacity: 1; }
  .milk .bottle { position: relative; flex: none; width: 24px; height: 24px; }
  .milk .bottle img { position: absolute; inset: 0; width: 24px; height: 24px; display: block; }
  /* 움직임이 없을 때(모션 줄이기)는 찬 병 그림 옆에 글자를 보여 준다. 글자가 늘 자리를 차지해 불러오는 동안에도 폭이 그대로다 */
  .milk-t { white-space: nowrap; }
  /* 화면 읽기 프로그램에만 전하는 '불러오는 중' */
  .milk-live { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .btn { min-height: 44px; padding: 0 16px; border-radius: var(--radius-sm); border: 1px solid var(--button-outline-border); background: var(--button-outline-bg); color: var(--button-outline-text); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
  .btn:hover { background: var(--button-outline-bg-hover); }
  .btn.small { min-height: 36px; padding: 0 12px; font-size: 13px; }
  .btn.primary { background: var(--button-primary-bg); border-color: var(--button-primary-bg); color: var(--button-primary-text); }
  .btn.primary:hover { background: var(--button-primary-bg-hover); }
  .btn:focus-visible, .item:focus-visible, .pick:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--color-border-focus); outline-offset: 2px; }
  input[type="number"], input[type="text"], select { min-height: 40px; padding: 0 10px; border: 1px solid var(--color-border-default); border-radius: var(--radius-sm); background: var(--color-bg-surface); max-width: 100%; min-width: 0; }
  input[type="number"] { width: 130px; }
  .act { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
  .act .btn.primary { justify-content: center; min-width: 140px; }
  .other { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--color-border-subtle); }
  .other input[type="text"] { flex: 1 1 180px; }
  .capped { margin: 0; padding: 10px 14px; font-size: 13px; background: var(--color-state-error-bg); border-bottom: 1px solid var(--color-border-subtle); overflow-wrap: anywhere; }
  .hint { color: var(--color-text-secondary); font-size: 13px; margin: 8px 0 0; }
  .msg { margin: 0 0 14px; padding: 10px 12px; border-radius: var(--radius-sm); font-size: 14px; overflow-wrap: anywhere; display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
  .msg.err { background: var(--color-state-error-bg); }
  .msg.good { background: var(--color-state-success-bg); }
  .msg .lines { min-width: 0; }
  .msg .lines div:not(:first-child) { font-size: 13px; color: var(--color-text-secondary); }
  .empty { padding: 40px 20px; text-align: center; color: var(--color-text-secondary); }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--color-bg-band); border-top: 1px solid var(--color-border-default); }
  .bar .in { max-width: 1160px; margin: 0 auto; padding: 12px 24px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
  .bar p { margin: 0; font-size: 14px; min-width: 0; flex: 1 1 240px; overflow-wrap: anywhere; }
  dialog { border: 1px solid var(--color-border-default); border-radius: var(--radius-md); background: var(--color-bg-surface); color: var(--color-text-primary); padding: 20px 22px; width: min(520px, calc(100vw - 32px)); }
  dialog::backdrop { background: var(--color-bg-inverse); opacity: 0.4; }
  dialog h2 { margin-bottom: 8px; }
  dialog ul { margin: 0 0 16px; padding-left: 18px; font-size: 14px; overflow-wrap: anywhere; max-height: 50vh; overflow: auto; }
  dialog .acts { display: flex; justify-content: flex-end; gap: 8px; }
  @media (max-width: 760px) {
    .wrap { padding: 16px 16px 180px; }
    .cols { grid-template-columns: minmax(0, 1fr); }
    .field .top { grid-template-columns: minmax(0, 1fr); gap: 4px; }
    .col-h { display: none; }
    .act { grid-template-columns: minmax(0, 1fr); }
  }
  /* 진행 표시. 곡선·길이는 motion.css 토큰만 쓴다(튕김 없음). 움직임 줄이기 설정이면 글자와 멈춘 표시만 남는다 */
  .progress { position: fixed; inset: 0 0 auto 0; height: 3px; overflow: hidden; opacity: 0; pointer-events: none; z-index: 10; background: var(--color-border-subtle); }
  .progress::after { content: ''; position: absolute; inset: 0; background: var(--color-border-focus); }
  body[data-busy] .progress { opacity: 1; }
  .btn:disabled { cursor: default; opacity: 0.55; }
  .btn[aria-busy="true"] { opacity: 1; }
  .btn[aria-busy="true"]::before { content: ''; flex: none; width: 14px; height: 14px; margin-right: 8px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; }
  .detail[data-busy] :is(.head, .memos, .col-h, .rows, .reports) { opacity: 0.5; }
  .item[aria-busy="true"] { background: var(--color-bg-surface-muted); }
  .msg.good::before { content: '✓'; font-weight: 700; flex: none; }
  .msg .lines { flex: 1 1 auto; }
  .skel { height: 14px; margin: 16px 14px; border-radius: var(--radius-sm); background: var(--color-bg-surface-muted); }
  .skel.short { width: 55%; }
  @media (prefers-reduced-motion: no-preference) {
    .item, .btn, .pick, .field { transition: background-color var(--dur-base) var(--ease-out), border-color var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-out), opacity var(--dur-base) var(--ease-out), transform var(--dur-press) var(--ease-out); }
    .btn:active:not(:disabled), .pick:active { transform: scale(0.97); }
    .item:active { transform: scale(0.99); }
    .progress { transition: opacity var(--dur-base) var(--ease-out); }
    .progress::after { transform-origin: left; animation: slide 1.4s var(--ease-in-out) infinite; }
    .btn[aria-busy="true"]::before { animation: spin 0.7s linear infinite; }
    .detail :is(.head, .memos, .col-h, .rows, .reports) { transition: opacity var(--dur-base) var(--ease-out); }
    .detail.enter > :not(#msg) { animation: rise var(--dur-base) var(--ease-out) both; }
    .msg.in { animation: rise var(--dur-slow) var(--ease-out) both; }
    .msg.in.good::before { animation: pop var(--dur-slow) var(--ease-out) both; }
    .item.in { animation: rise var(--dur-slow) var(--ease-out) both; animation-delay: calc(var(--i, 0) * 40ms); }
    .item[aria-busy="true"] { animation: breathe 1.2s var(--ease-in-out) infinite alternate; }
    .item.leaving { opacity: 0; transform: translateX(16px); height: 0 !important; min-height: 0; padding-top: 0; padding-bottom: 0; border-bottom-width: 0; overflow: hidden; transition: opacity var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out), height var(--dur-base) var(--ease-in-out) 120ms, min-height var(--dur-base) var(--ease-in-out) 120ms, padding var(--dur-base) var(--ease-in-out) 120ms; }
    #fresh-box { animation: rise var(--dur-slow) var(--ease-out) both; }
    .skel { background: linear-gradient(90deg, var(--color-bg-surface-muted) 25%, var(--color-border-subtle) 37%, var(--color-bg-surface-muted) 63%); background-size: 400% 100%; animation: shimmer 1.4s linear infinite; }
    /* 새로 고침 ↔ 로더는 옅어지며 바뀐다 */
    .milk { transition: opacity 180ms var(--ease-out); }
    .refresh-slot .btn { transition: opacity 180ms var(--ease-out), background-color var(--dur-base) var(--ease-out), transform var(--dur-press) var(--ease-out); }
    .milk-t { display: none; }
    /* 빨대로 빨리듯 찬 병을 위에서부터 잘라 우유 높이가 내려간다(1050ms). 다 빨리면 잠깐 멈췄다가 다시 가득 찬 병에서 되풀이 */
    .refresh-slot[data-loading] .milk .on { animation: sip 1400ms var(--ease-in-out) infinite; }
    @keyframes sip { from { clip-path: inset(22% 0 0 0); } 75%, to { clip-path: inset(92% 0 0 0); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes slide { from { transform: translateX(-100%) scaleX(0.4); } to { transform: translateX(100%) scaleX(0.4); } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
    @keyframes pop { from { opacity: 0; transform: scale(0.6); } }
    @keyframes breathe { to { opacity: 0.55; } }
    @keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
  }
</style>
</head>
<body>
<div class="progress" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <div>
      <h1>탕방 제보함</h1>
      <p class="sub" id="summary">제보를 읽는 중이에요</p>
    </div>
    <span class="demo" id="demo" hidden>예시 모드 · 아무것도 바뀌지 않아요</span>
  </header>
  <div class="cols">
    <nav class="card list" aria-label="새 제보">
      <div class="list-head">
        <h3 id="list-title">새 제보</h3>
        <span class="refresh-slot" id="refresh-slot">
          <button class="btn small" id="refresh">새로 고침</button>
          <span class="milk">
            <span class="bottle" aria-hidden="true"><img src="/banana-off.svg" alt=""><img class="on" src="/banana-on.svg" alt=""></span>
            <span class="milk-t" aria-hidden="true">불러오는 중</span>
            <span class="milk-live" id="milk-live" role="status"></span>
          </span>
        </span>
      </div>
      <p class="capped" id="capped" hidden></p>
      <div class="sweep" id="fresh-box" hidden><button class="btn small" id="fresh"></button></div>
      <div class="sweep" id="sweep-box" hidden><button class="btn small" id="sweep"></button></div>
      <div id="list" aria-busy="true"><div class="skel"></div><div class="skel short"></div><div class="skel"></div><div class="skel short"></div></div>
    </nav>
    <main class="card detail" id="detail"><p class="empty">제보를 읽는 중이에요</p></main>
  </div>
</div>
<div class="bar"><div class="in">
  <p id="bar-text"></p>
  <button class="btn" id="export">화면에 내보내기</button>
</div></div>
<dialog id="confirm">
  <h2 id="c-title"></h2>
  <ul id="c-list"></ul>
  <div class="acts">
    <button class="btn" id="c-no">취소</button>
    <button class="btn primary" id="c-yes">확인</button>
  </div>
</dialog>
<script>
const TOKEN = '__TOKEN__'
const $ = (id) => document.getElementById(id)
// 제보 내용은 항상 textContent로만 넣는다(innerHTML 금지)
const el = (tag, props = {}, ...kids) => {
  const n = document.createElement(tag)
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') n.className = v
    else if (k === 'text') n.textContent = v
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v)
    else if (v !== false && v != null) n.setAttribute(k, v === true ? '' : v)
  }
  for (const c of kids.flat(3)) if (c != null && c !== false) n.append(c)
  return n
}
const CHIP_CLASS = { '새 정보': 'new', '인상 가능성': 'warn', '확인값과 다름': 'warn', '충돌': 'bad', '이미 반영됨': 'ok' }
const SWEEP_CHIPS = ['시험', '반려 추천', '이미 반영됨']
const SOURCES = ['네이버 플레이스 가격표(업체 등록)', '업체 공식 홈페이지', '네이버 방문자 후기·블로그(최근 1년)', '공공데이터(착한가격업소 등)', '직접 방문 확인']
const REASONS = ['근거와 다름', '허위·이상값', '서비스에 없는 업체', '시험·장난 제보', '이미 반영된 값']
const SIDE = { women: '여탕', men: '남탕' }
const SRC_KEY = 'tangbang:desk:src'
const remember = (v) => { try { localStorage.setItem(SRC_KEY, v) } catch {} }
const remembered = () => { try { return localStorage.getItem(SRC_KEY) || '' } catch { return '' } }

let data = null
let selKey = null
let lastMsg = null // { kind, lines, undo }
let picks = {} // 칸마다 고른 것: { mode: 'ok' | 'diff', value, sides }. 없으면 '못 봄'
let barNote = null

async function api(path, body) {
  try {
    const r = await fetch(path, body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Desk-Token': TOKEN }, body: JSON.stringify(body) })
    return await r.json()
  } catch {
    return { ok: false, error: '제보함 프로그램과 연결이 끊겼어요. 제보함을 다시 켜 주세요' }
  }
}

// 진행 표시: 일이 도는 동안 창 맨 위에 줄이 흐르고, 누른 버튼은 '~하는 중…'으로 바뀐다
const reduced = matchMedia('(prefers-reduced-motion: reduce)')
let pending = 0
const progress = (on) => { pending = Math.max(0, pending + (on ? 1 : -1)); document.body.toggleAttribute('data-busy', pending > 0) }
async function busy(btn, label, fn) {
  if (!btn || btn.getAttribute('aria-busy') === 'true') return
  const old = btn.textContent
  btn.setAttribute('aria-busy', 'true')
  btn.disabled = true
  btn.textContent = label
  progress(true)
  try {
    return await fn()
  } finally {
    progress(false)
    btn.removeAttribute('aria-busy')
    btn.disabled = false
    if (btn.textContent === label) btn.textContent = old // 그사이 다른 글자로 바뀌었으면 그대로 둔다
  }
}
// 처리한 업체가 목록에서 옆으로 빠지며 접힌다
function leave(node) {
  if (!node || reduced.matches) return Promise.resolve()
  node.style.height = node.offsetHeight + 'px'
  void node.offsetHeight
  node.classList.add('leaving')
  return new Promise((r) => setTimeout(r, 440))
}
let enterNext = true // 다음에 목록을 그릴 때 한 줄씩 올라오게 할지(처음 열 때·새로 고침)
let shownKey = null // 상세에 보이고 있는 업체(바뀔 때만 내용이 올라온다)
let paintedMsg = null // 이미 보여 준 안내(같은 안내가 다시 그려질 때는 움직이지 않는다)

function ask(title, lines, yesLabel) {

async function load(nextIndex) {
  const j = await api('/api/reports')
  $('list').removeAttribute('aria-busy')
  if (!j.ok) {
    data = null
    $('summary').textContent = '제보를 읽지 못했어요'
    $('list').replaceChildren()

    return
  }
  data = j
  lastCheck = Date.now()
  $('fresh-box').hidden = true

  const need = ['새 정보', '인상 가능성', '확인값과 다름', '충돌'].reduce((a, c) => a + j.counts[c], 0)
  $('summary').textContent = `새 제보 ${j.total}건 · 확인할 것 ${need}건 · 정리 대상 ${j.sweep}건 (${j.cond})`
  const at = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false })
  $('list-title').textContent = `새 제보 ${j.total}건${j.capped ? ' 이상' : ''} · 업체 ${j.groups.length}곳 · ${at} 기준`
  // 한 번에 읽는 한도까지 찼으면 더 오래된 제보가 안 보이는 것이라 알린다
  $('capped').hidden = !j.capped
  $('capped').textContent = `최근 ${j.total}건까지만 보여요. 더 오래된 새 제보가 남아 있을 수 있으니, 여기 있는 것을 처리한 뒤 다시 확인해 주세요.`
  $('sweep-box').hidden = j.sweep === 0
  $('sweep').textContent = `정리 대상 ${j.sweep}건 한 번에 처리`
  // 판정한 뒤에는 같은 자리의 다음 업체로 넘어간다
  if (nextIndex != null) selKey = j.groups[Math.min(nextIndex, j.groups.length - 1)]?.key ?? null
  else if (!j.groups.some((g) => g.key === selKey)) selKey = j.groups[0]?.key ?? null
  picks = {}
  renderList()
  renderDetail()
  renderBar()
}

// 5분마다(창을 떠나 있었으면 돌아올 때) 새 제보가 들어왔는지만 본다.
// 판정 중인 화면은 바꾸지 않고 목록 위에 알림만 띄운다. 누르면 그때 다시 읽는다.
const CHECK_MS = 5 * 60 * 1000
let lastCheck = Date.now()
async function checkFresh() {
  if (!data || document.hidden) return
  lastCheck = Date.now()
  const j = await api('/api/reports')
  if (!j.ok || !data) return
  const known = new Set(data.groups.flatMap((g) => g.report_ids))
  const n = j.groups.flatMap((g) => g.report_ids).filter((id) => !known.has(id)).length
  $('fresh').textContent = `새 제보 ${n}건 들어옴 · 불러오기`
  $('fresh-box').hidden = n === 0
}
setInterval(checkFresh, CHECK_MS)
document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - lastCheck >= CHECK_MS) checkFresh() })
$('fresh').onclick = () => busy($('fresh'), '불러오는 중…', async () => { lastMsg = null; enterNext = true; await load() })
// 기다리지 않고 바로 다시 읽기. 보던 업체가 그대로 있으면 고르던 판정(맞음·다름)은 지우지 않는다.
// 불러오는 동안 버튼 자리에 바나나우유 로더가 돈다. 너무 빨리 끝나도 번쩍이지 않게 적어도 0.4초는 보여 준다.
const LOADER_MIN_MS = 400
// 로딩이 끝나면 남은 우유를 빠르게 마저 빨고(빈 병) 버튼으로 돌아온다: 우유가 내려가던 높이에서 이어서 시작해, '다 빨렸다 = 다 불러왔다'가 맞아떨어진다.
// 남은 양이 많을수록 조금 더 걸린다(220~520ms). 곡선은 motion.css의 --ease-out. 모션 줄이기에서는 하지 않는다(false를 돌려준다)
const SIP_FROM = 22
const SIP_END = 92
let drainAnim = null
async function drain(slot) {
  const on = slot.querySelector('.milk .on')
  if (!on || typeof on.animate !== 'function' || matchMedia('(prefers-reduced-motion: reduce)').matches) return false
  const m = /inset\(([\d.]+)%/.exec(getComputedStyle(on).clipPath || '')
  const now = m ? Math.min(SIP_END, Math.max(SIP_FROM, Number(m[1]))) : SIP_FROM
  const left = (SIP_END - now) / (SIP_END - SIP_FROM) // 남은 우유(0~1)
  const ease = getComputedStyle(document.documentElement).getPropertyValue('--ease-out').trim() || 'ease-out'
  drainAnim = on.animate([{ clipPath: `inset(${now}% 0 0 0)` }, { clipPath: `inset(${SIP_END}% 0 0 0)` }], { duration: 220 + 300 * left, easing: ease, fill: 'forwards' })
  await drainAnim.finished.catch(() => {})
  await new Promise((r) => setTimeout(r, 120)) // 빈 병을 잠깐 보여 준다
  return true
}
$('refresh').onclick = async () => {
  const [slot, btn] = [$('refresh-slot'), $('refresh')]
  if (slot.hasAttribute('data-loading')) return
  const began = Date.now()
  const focused = document.activeElement === btn
  drainAnim?.cancel() // 지난번에 비워 둔 병을 다시 채운다
  drainAnim = null
  slot.setAttribute('data-loading', '')
  btn.disabled = true // 불러오는 중에는 다시 누를 수 없다
  $('milk-live').textContent = '불러오는 중'
  progress(true)
  try {
    const [keepKey, keepPicks] = [selKey, picks]
    enterNext = true
    await load()
    if (data && selKey === keepKey && Object.keys(keepPicks).length) { picks = keepPicks; renderDetail() }
    // 다 불러왔으면 남은 우유를 마저 빨고 끝낸다. 움직임이 없을 때(모션 줄이기)는 번쩍이지 않게 최소 시간만 지킨다
    if (!(await drain(slot))) {
      const left = LOADER_MIN_MS - (Date.now() - began)
      if (left > 0) await new Promise((r) => setTimeout(r, left))
    }
  } finally {
    progress(false)
    slot.removeAttribute('data-loading')
    btn.disabled = false
    $('milk-live').textContent = ''
    if (focused && document.activeElement === document.body) btn.focus()
  }
}

function renderList() {
  const enter = enterNext
  enterNext = false
  $('list').replaceChildren(
    ...data.groups.map((g, i) => {
      const first = g.fields.map((f) => `${f.label} ${f.reported.map((r) => r.text).join(f.kind === 'tips' ? ' / ' : ' 대 ')}`).join(' · ')
      return el('button', { class: 'item' + (enter ? ' in' : ''), style: `--i:${Math.min(i, 8)}`, 'aria-current': g.key === selKey ? 'true' : 'false', onclick: () => { selKey = g.key; lastMsg = null; picks = {}; renderList(); renderDetail() } },
        el('b', { text: g.place_name }),
        el('span', { class: 's', text: `${first} · ${g.report_ids.length}건` }),
        el('span', { class: 'chip ' + (CHIP_CLASS[g.chip] || ''), text: g.chip }),
        g.reports.some((r) => r.memo) && el('span', { class: 'chip note', text: '덧붙일 말 있음' }),
      )
    }),
  )
  if (!data.groups.length) $('list').append(el('p', { class: 'empty', text: '새 제보가 없어요' }))
}

// 안내는 입력 칸을 다시 그리지 않고 안내 자리만 바꾼다(적어 둔 값이 지워지지 않게)
function paintMsg() {

  if (!box) return

  paintedMsg = lastMsg
  box.replaceChildren(...(lastMsg ? [el('div', { class: `msg ${lastMsg.kind}${fresh ? ' in' : ''}`, role: 'status' },
    el('div', { class: 'lines' }, lastMsg.lines.map((t) => el('div', { text: t }))),

}
function showMsg(kind, lines, undoable) {
  lastMsg = { kind, lines, undo: undoable }
  paintMsg()
  $('msg')?.scrollIntoView({ block: 'nearest' })

const dryerSides = (text) => {
  const s = {}
  for (const part of String(text).split(' · ')) {
    if (part.startsWith('여탕 ')) s.women = part.slice(3)
    else if (part.startsWith('남탕 ')) s.men = part.slice(3)
  }
  return s
}

// 칸 하나에서 고를 수 있는 '맞음' 버튼들. 수건·드라이기는 어느 탕인지까지 골라야 한다
function okChoices(f) {
  const good = f.reported.filter((r) => !r.outlier)
  const many = good.length > 1
  const out = []
  for (const r of good) {
    const name = many ? `${r.text} ` : ''
    if (f.kind === 'price' || f.kind === 'pay' || f.kind === 'parking') out.push({ label: `${name}맞음`, value: r.value })
    else {
      // 수건도 드라이기처럼 '남탕 2장'으로 탕을 말해 올 수 있다. 탕을 말한 제보는 그 탕 값으로만 맞음을 고른다
      const sided = dryerSides(r.value)
      // '유료'(돈 내고 빌림)는 수건 안내가 아니라 수건 요금 칸으로 반영하는 값이라 여기서는 맞음을 두지 않는다
      if (f.kind === 'towel' && [sided.women, sided.men].includes('유료')) continue
      if (sided.women || sided.men) out.push({ label: `${name}${sided.women && sided.men ? '' : sided.women ? '여탕 ' : '남탕 '}맞음`, sides: { women: sided.women || '', men: sided.men || '' } })
      else out.push(
        { label: `${name}여탕·남탕 다 맞음`, sides: { women: r.value, men: r.value } },
        { label: `${name}여탕만 맞음`, sides: { women: r.value, men: '' } },
        { label: `${name}남탕만 맞음`, sides: { women: '', men: r.value } },
      )
    }
  }
  return out
}

// 알아둘 것 한 줄: 종류는 작은 표시, 글은 본문 크기(제보 내용은 textContent로만)
const tipLine = (t) => el('div', { class: 'tip' }, el('span', { class: 'chip', text: t.kind }), el('span', { class: 't', text: t.text }))

// 가기 전 알아둘 것: 글마다 따로 맞음(다듬어서 넣기)·버림·못 봄을 고른다
function tipsCard(g, f) {
  const items = picks[f.key]?.items || {}
  const setTip = (of, v) => {
    const cur = picks[f.key] || { mode: 'tips', items: {} }
    if (v) cur.items[of] = v
    else delete cur.items[of]
    if (Object.keys(cur.items).length) picks[f.key] = cur
    else delete picks[f.key]
    renderDetail()
  }
  const now = f.current.tips || []
  return el('div', { class: 'field', 'data-mode': picks[f.key] ? 'ok' : 'skip' },
    el('div', { class: 'top' },
      el('span', { class: 'k', text: f.label }),
      el('div', { class: 'v' }, f.reported.map((r) => {
        const of = r.value.text
        const it = items[of]
        const pick = (text, on, v) => el('button', { class: 'pick', 'aria-pressed': on ? 'true' : 'false', text, onclick: () => setTip(of, v) })
        return el('div', { class: 'tipbox' },
          tipLine(r.value),
          el('small', { text: `제보 ${r.ids.map((i) => '#' + i).join(', ')}${r.known ? ' · 이미 화면에 있는 글' : ''}` }),
          g.can_apply && el('div', { class: 'picks', role: 'group', 'aria-label': `알아둘 것 근거 확인: ${of}` },
            pick('맞음', it?.ok === true, { ok: true, kind: r.value.kind, text: of }),
            pick('버림', it?.ok === false, { ok: false }),
            pick('못 봄', !it, null)),
          it?.ok && el('div', { class: 'tipedit' },
            el('select', { 'aria-label': '종류', onchange: (e) => { it.kind = e.target.value } }, data.options.tip_kinds.map((o) => el('option', { value: o, text: o, selected: it.kind === o }))),
            el('input', { type: 'text', maxlength: data.options.tip_max, value: it.text, 'aria-label': `화면에 넣을 글 (다듬기, ${data.options.tip_max}자까지)`, oninput: (e) => { it.text = e.target.value } })))
      })),
      now.length
        ? el('div', { class: 'v' }, now.map((t) => el('div', { class: 'tipbox' }, tipLine(t), t.date && el('small', { text: `확인일 ${t.date}` }))))
        : el('div', { class: 'v none', text: '없음' })))
}

function fieldCard(g, f) {
  if (f.kind === 'tips') return tipsCard(g, f)
  const p = picks[f.key]
  const proof = g.evidence?.by?.[f.key] || []
  const set = (v) => { picks[f.key] = v; renderDetail() }
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b)
  const choices = okChoices(f).map((c) => {
    const v = { mode: 'ok', ...(c.sides ? { sides: c.sides } : { value: c.value }) }
    return el('button', { class: 'pick', 'aria-pressed': same(p, v) ? 'true' : 'false', text: c.label, onclick: () => set(v) })
  })
  let diffBox = null
  if (p?.mode === 'diff') {
    if (f.kind === 'price') diffBox = el('input', { type: 'number', min: 0, max: 200000, step: 100, inputmode: 'numeric', placeholder: '근거에서 본 값', 'aria-label': `${f.label} 근거 값`, value: p.value ?? '', oninput: (e) => { p.value = e.target.value === '' ? null : Number(e.target.value); paintApply(g) } })
    else if (f.kind === 'pay') diffBox = el('select', { 'aria-label': `${f.label} 근거 값`, onchange: (e) => { p.value = e.target.value; paintApply(g) } }, el('option', { value: '', text: '고르기' }), data.options.pay.map((o) => el('option', { value: o, text: o, selected: p.value === o })))
    else if (f.kind === 'parking') diffBox = [
      el('select', { 'aria-label': '주차 가능 여부', onchange: (e) => { p.value.available = e.target.value; paintApply(g) } }, el('option', { value: '', text: '가능 여부 모름' }), data.options.parking.map((o) => el('option', { value: o, text: o, selected: p.value.available === o }))),
      el('input', { type: 'text', maxlength: data.options.parking_note_max, value: p.value.note, placeholder: '안내 글 (예: 목욕 3시간 무료)', 'aria-label': `주차 안내 글 (${data.options.parking_note_max}자까지)`, oninput: (e) => { p.value.note = e.target.value } }),
    ]
    else diffBox = ['women', 'men'].map((side) => el('label', {}, SIDE[side],
      el('select', { onchange: (e) => { p.sides[side] = e.target.value; paintApply(g) } }, el('option', { value: '', text: '모름' }), (f.kind === 'towel' ? data.options.towel : data.options.dryer).map((o) => el('option', { value: o, text: o, selected: p.sides[side] === o })))))
  }
  return el('div', { class: 'field', 'data-mode': p?.mode || 'skip' },
    el('div', { class: 'top' },
      el('span', { class: 'k', text: f.label }),
      el('div', { class: 'v' }, f.reported.map((r) => el('div', {}, r.text,
        el('small', { text: `제보 ${r.ids.map((i) => '#' + i).join(', ')}` }),
        r.mark && el('span', { class: 'tag sus', text: `${r.mark === 'fake' ? '허위 기준' : '의심'}: ${r.why}` })))),
      f.current.text
        ? el('div', { class: 'v' }, f.current.text, el('small', { text: [f.current.checked && `확인일 ${f.current.checked}`, f.current.source].filter(Boolean).join(' · ') }))
        : el('div', { class: 'v none', text: '없음' })),
    proof.length > 0 && el('div', { class: 'proof' }, el('b', { text: `수집해 둔 네이버 근거 (${g.evidence.collected || '날짜 모름'} 수집)` }), proof.map((t) => el('div', { text: t }))),
    g.can_apply && el('div', { class: 'picks', role: 'group', 'aria-label': `${f.label} 근거 확인` },
      choices,
      el('button', { class: 'pick', 'aria-pressed': p?.mode === 'diff' ? 'true' : 'false', text: '다름', onclick: () => set(f.kind === 'price' || f.kind === 'pay' ? { mode: 'diff', value: null }
        // 주차는 제보 값을 채워 두고 고쳐 적게 한다(안내 글 다듬기)
        : f.kind === 'parking' ? { mode: 'diff', value: { available: '', note: '', ...(f.reported.find((r) => !r.outlier)?.value || {}) } }
        : { mode: 'diff', sides: { women: '', men: '' } }) }),
      el('button', { class: 'pick', 'aria-pressed': !p ? 'true' : 'false', text: '못 봄', onclick: () => { delete picks[f.key]; renderDetail() } })),
    diffBox && el('div', { class: 'diff' }, diffBox),
  )
}

// 고른 것 → 서버에 보낼 근거. 값이 덜 채워진 칸이 있으면 그 칸 이름을 알려 준다
function evidenceOf(g) {
  const ev = {}
  for (const f of g.fields) {
    const p = picks[f.key]
    if (!p) continue
    if (p.mode === 'tips') {
      const list = Object.entries(p.items).map(([of, v]) => (v.ok ? { of, ok: true, kind: v.kind, text: v.text.trim() } : { of, ok: false }))
      if (list.some((t) => t.ok && !t.text)) return { missing: f.label }
      ev[f.key] = list
    } else if (f.kind === 'parking') {
      const v = { available: p.value?.available || '', note: (p.value?.note || '').trim() }
      if (!v.available && !v.note) return { missing: f.label }
      ev[f.key] = v
    } else if (p.sides) {
      if (!p.sides.women && !p.sides.men) return { missing: f.label }
      ev[f.key] = p.sides
    } else {
      if (p.value == null || p.value === '') return { missing: f.label }
      ev[f.key] = p.value
    }
  }
  return { ev }
}
function paintApply(g) {
  const b = $('apply')
  if (b) b.textContent = `반영 (${Object.keys(picks).length}칸)`
}

// 판정하는 동안: 누른 버튼은 '~하는 중…', 상세는 잠기고, 목록의 그 업체가 숨 쉬듯 옅어진다. 끝나면 목록에서 빠진다
function decide(g, verdict, extra, btn) {
  return busy(btn, { apply: '반영하는 중…', reject: '반려하는 중…', unknown: '남기는 중…' }[verdict], () => runDecide(g, verdict, extra))
}
async function runDecide(g, verdict, extra) {
  const index = data.groups.findIndex((x) => x.key === g.key)
  const [detail, item] = [$('detail'), document.querySelector('#list .item[aria-current="true"]')]
  detail.setAttribute('data-busy', '')
  detail.inert = true
  item?.setAttribute('aria-busy', 'true')
  const j = await api('/api/decide', { place_id: g.place_id, place_name: g.place_name, ids: g.report_ids, verdict, ...extra })
  detail.removeAttribute('data-busy')
  detail.inert = false
  item?.removeAttribute('aria-busy')
  if (j.error) return showMsg('err', [j.error])
  if (j.ok) await leave(item)
  const word = { apply: '반영했어요', reject: '반려했어요', unknown: '확인 못 함으로 남겼어요' }[verdict]
  lastMsg = {
    kind: j.ok ? 'good' : 'err', undo: j.done.length > 0 || j.wrote.length > 0,
    lines: [
      `${g.place_name}: ${word}${j.demo ? ' (예시 모드라 실제로는 바꾸지 않았어요)' : ''}`,
      ...j.wrote.map((w) => `파일: ${w}`),
      ...j.done.map((d) => `제보 #${d.id} → ${d.status} · ${d.note}`),
      ...j.failed.map((d) => `제보 #${d.id} 상태를 못 바꿨어요(${d.status}): ${d.error}`),
      ...(j.failed.length ? ['파일은 이미 적었어요. 같은 판정을 한 번 더 누르면 남은 제보 상태만 다시 바꿔요.'] : []),
    ],
  }
  await load(j.ok ? index : undefined)
}

async function undo() {
  const j = await api('/api/undo', {})
  lastMsg = j.error ? { kind: 'err', lines: [j.error] } : { kind: j.ok ? 'good' : 'err', lines: [`되돌렸어요: ${j.label}`, ...j.lines] }
  await load()
}

function renderDetail() {
  const d = $('detail')
  const g = data?.groups.find((x) => x.key === selKey)
  const msg = el('div', { id: 'msg' })
  if (!g) {
    d.replaceChildren(msg, el('p', { class: 'empty', text: '새 제보가 없어요. 제보가 들어오면 여기에 나타나요.' }))
    return paintMsg()
  }
  const q = encodeURIComponent(g.place_name)
  const naver = g.evidence?.naver_id ? `https://m.place.naver.com/place/${encodeURIComponent(g.evidence.naver_id)}/home` : `https://map.naver.com/p/search/${q}`
  const kids = [
    el('div', { class: 'head' },
      el('div', {},
        el('h2', { text: g.place_name }),
        el('p', { class: 'addr', text: `${g.addr || '서비스 목록에 없는 업체'} · ` }, el('span', { class: 'chip ' + (CHIP_CLASS[g.chip] || ''), text: g.chip }), ` ${g.reason}`, g.warn && el('span', { class: 'chip warn', text: `의심: ${g.warn}` }))),
      g.in_service && el('div', { class: 'links' },
        el('a', { class: 'btn small', href: naver, target: '_blank', rel: 'noopener noreferrer', text: g.evidence?.naver_id ? '네이버 플레이스' : '네이버에서 찾기' }),
        g.kakao_url && el('a', { class: 'btn small', href: g.kakao_url.replace(/^http:/, 'https:'), target: '_blank', rel: 'noopener noreferrer', text: '카카오맵' }))),
    el('h3', { class: 'step' }, el('span', { text: g.can_apply ? '1 제보와 근거 · 근거에서 본 칸만 골라 주세요' : '1 제보 내용' }),
      g.can_apply && el('button', { class: 'btn small', text: '전부 맞음', onclick: () => {
        for (const f of g.fields) {
          if (f.kind === 'tips') {
            // 아직 화면에 없는 글을 모두 '맞음'으로(글은 그 뒤에 다듬을 수 있다)
            const items = Object.fromEntries(f.reported.filter((r) => !r.known).map((r) => [r.value.text, { ok: true, kind: r.value.kind, text: r.value.text }]))
            if (Object.keys(items).length) picks[f.key] = { mode: 'tips', items }
            continue
          }
          const c = okChoices(f)
          if (c.length === 1) picks[f.key] = { mode: 'ok', ...(c[0].sides ? { sides: c[0].sides } : { value: c[0].value }) }
        }
        renderDetail()
        if (g.fields.some((f) => !picks[f.key])) showMsg('good', ['탕을 골라야 하는 칸(수건·드라이기)과 값이 여러 개인 칸은 직접 골라 주세요.'])
      } })),
    // 덧붙일 말: 제보 내용은 textContent로만 넣는다(el의 text)
    g.reports.some((r) => r.memo) && el('div', { class: 'memos' }, g.reports.filter((r) => r.memo).map((r) =>
      el('blockquote', { class: 'memo' }, el('b', { text: `덧붙일 말 · #${r.id} · ${r.source}` }), el('span', { text: r.memo })))),
    el('div', { class: 'col-h' }, el('span'), el('span', { text: '제보 값' }), el('span', { text: '지금 화면 값' })),
    el('div', { class: 'rows' }, g.fields.map((f) => fieldCard(g, f))),
    el('ul', { class: 'reports' }, g.reports.map((r) => el('li', { text: `#${r.id} · ${r.at} · ${r.source}${r.memo ? ' · 덧붙일 말 있음(위)' : ''}` }))),
    el('h3', { class: 'step' }, el('span', { text: '2 판정' })),
  ]
  const reason = el('select', { 'aria-label': '반려 사유' }, REASONS.map((r) => el('option', { value: r, text: r, selected: r === (g.chip === '시험' ? '시험·장난 제보' : g.chip === '이미 반영됨' ? '이미 반영된 값' : g.chip === '반려 추천' ? (g.in_service ? '허위·이상값' : '서비스에 없는 업체') : '근거와 다름') })))
  const memo = el('input', { type: 'text', maxlength: 80, placeholder: '어디까지 봤는지 (예: 네이버 가격표 없음)', 'aria-label': '확인 못 함 메모' })
  if (g.can_apply) {
    const src = el('select', { id: 'src', 'aria-label': '근거 출처', onchange: (e) => remember(e.target.value) }, el('option', { value: '', text: '근거 출처 고르기' }), SOURCES.map((s) => el('option', { value: s, text: s, selected: s === remembered() })))
    kids.push(el('div', { class: 'act' }, src,
      el('button', { class: 'btn primary', id: 'apply', text: `반영 (${Object.keys(picks).length}칸)`, onclick: (e) => {
        const { ev, missing } = evidenceOf(g)
        if (missing) return showMsg('err', [`${missing}: 근거에서 본 값을 골라 주세요.`])
        if (!Object.keys(ev).length) return showMsg('err', ['근거에서 본 칸이 없어요. 칸마다 맞음 또는 다름을 골라 주세요.'])
        if (!src.value) return showMsg('err', ['근거 출처를 골라 주세요.'])
        decide(g, 'apply', { evidence: ev, source: src.value }, e.currentTarget)
      } })))
  } else kids.push(el('p', { class: 'hint', text: '이 묶음은 반영할 수 없어요. 반려하거나 확인 못 함으로 남겨 주세요.' }))
  kids.push(el('div', { class: 'other' },
    reason, el('button', { class: 'btn', text: '반려', onclick: (e) => decide(g, 'reject', { reason: reason.value }, e.currentTarget) }),
    memo, el('button', { class: 'btn', text: '확인 못 함', onclick: (e) => decide(g, 'unknown', { memo: memo.value }, e.currentTarget) })))
  d.replaceChildren(...[msg, ...kids].filter(Boolean))
  paintMsg()
  // 다른 업체로 바뀔 때만 내용이 아래에서 올라온다(칸을 고를 때마다 움직이면 어지럽다)
  if (shownKey !== selKey) {
    shownKey = selKey
    d.classList.remove('enter')
    void d.offsetWidth
    d.classList.add('enter')
  }
}

$('sweep').onclick = async () => {
  const targets = data.groups.filter((g) => SWEEP_CHIPS.includes(g.chip))
  const lines = targets.map((g) => `${g.place_name} · ${g.reason} · ${g.report_ids.length}건 → ${g.chip === '이미 반영됨' ? '확인함' : '반려'}`)
  if (!(await ask(`정리 대상 ${data.sweep}건을 처리할까요?`, [...lines, '파일은 바꾸지 않고 제보 상태만 바꿔요. 바로 되돌릴 수 있어요.'], '처리'))) return
  await busy($('sweep'), '정리하는 중…', async () => {
    const j = await api('/api/sweep', {})
    lastMsg = j.error ? { kind: 'err', lines: [j.error] } : { kind: j.ok ? 'good' : 'err', undo: j.done.length > 0, lines: [`정리했어요: ${j.done.length}건${j.demo ? ' (예시 모드라 실제로는 바꾸지 않았어요)' : ''}`, ...j.failed.map((d) => `제보 #${d.id} 상태를 못 바꿨어요: ${d.error}`)] }
    if (!j.error) await Promise.all([...document.querySelectorAll('#list .item')].filter((_, i) => SWEEP_CHIPS.includes(data.groups[i]?.chip)).map(leave))
    await load()
  })
}

function renderBar() {
  $('bar-text').textContent = barNote || (data?.stale ? '반영한 값이 아직 사용자 화면에 나가지 않았어요.' : '반영한 값은 내보내야 사용자 화면에 나가요.')
}
// 내보내기: 화면 데이터를 다시 만들어 초안으로 올리고(사용자 화면은 그대로), 차이를 보여 준 뒤 한 번 확인받고 공개한다
$('export').onclick = async () => {
  // 오래 걸리는 일이라 몇 초째인지 같이 보여 준다
  const began = Date.now()
  const note = () => { barNote = `화면 데이터를 다시 만드는 중이에요 · ${Math.round((Date.now() - began) / 1000)}초째 (1~2분 걸릴 수 있어요)`; renderBar() }
  note()
  const tick = setInterval(note, 1000)
  const j = await busy($('export'), '다시 만드는 중…', () => api('/api/rebuild', {}))
  clearInterval(tick)
  if (!j) return
  if (!j.ok) { barNote = `내보내지 못했어요: ${j.error}`; return renderBar() }
  if (j.demo) { barNote = j.lines.join(' '); return renderBar() }
  const c = j.counts
  if (c.added + c.removed + c.changed === 0) { barNote = '공개본과 차이가 없어요. 내보낼 것이 없습니다.'; return renderBar() }
  barNote = `초안을 올렸어요(사용자 화면은 아직 그대로). 바뀐 곳 ${c.changed} · 새로 생김 ${c.added} · 빠짐 ${c.removed} · 대인 요금 바뀜 ${c.priceChanged}`
  renderBar()
  const lines = [
    `공개본 ${c.live}곳 → 초안 ${c.draft}곳`,
    `내용 바뀜 ${c.changed}곳 · 새로 생김 ${c.added}곳 · 빠짐 ${c.removed}곳`,
    ...(j.priceChanges || []).map((p) => `요금: ${p.name} ${p.before ?? '없음'} → ${p.after ?? '없음'}`),
    ...(j.added?.length ? [`새로 생김: ${j.added.join(', ')}`] : []),
    ...(j.removed?.length ? [`빠짐: ${j.removed.join(', ')}`] : []),
    '공개하면 1분 안에 사용자 화면에 반영돼요.',
  ]
  if (!(await ask('사용자 화면에 공개할까요?', lines, '공개'))) return
  barNote = '공개하는 중이에요.'
  renderBar()
  const p = await busy($('export'), '공개하는 중…', () => api('/api/publish', {}))
  if (!p) return
  barNote = p.ok ? `공개했어요: 스냅샷 #${p.from ?? '-'} → #${p.to} (${p.count}곳). 1분 안에 사용자 화면에 반영돼요.` : `공개하지 못했어요: ${p.error}`
  renderBar()
}
load()
</script>
</body>
</html>
